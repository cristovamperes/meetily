# Test-only, unsigned portable build. Never publish a release or run an installer.
name: Whisper NPU portable Windows test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build local summarization sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CMAKE_PROJECT_INCLUDE = (Join-Path $env:GITHUB_WORKSPACE '.github/force-portable-ggml.cmake').Replace('\', '/')
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v2'
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path llama-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'llama-helper build failed' }
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
      - name: Build Meetily without an installer
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CMAKE_PROJECT_INCLUDE = (Join-Path $env:GITHUB_WORKSPACE '.github/force-portable-ggml.cmake').Replace('\', '/')
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v2'
          pnpm tauri build --no-bundle --ci --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Meetily build failed' }
      - name: Stage unsigned portable files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'meetily-npu-portable'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/meetily.exe $stage
          Copy-Item frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe (Join-Path $stage 'llama-helper-x86_64-pc-windows-msvc.exe')
          Copy-Item frontend/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe (Join-Path $stage 'ffmpeg-x86_64-pc-windows-msvc.exe')
          Copy-Item frontend/src-tauri/binaries/onnxruntime/* (Join-Path $stage '.')
          Copy-Item frontend/src-tauri/templates (Join-Path $stage 'templates') -Recurse
          $webview = 'target/x86_64-pc-windows-msvc/release/WebView2Loader.dll'
          if (Test-Path $webview) { Copy-Item $webview $stage }
          $archive = Join-Path $env:RUNNER_TEMP 'meetily-npu-portable.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          "PORTABLE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: meetily-npu-portable-windows
          path: ${{ env.PORTABLE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
